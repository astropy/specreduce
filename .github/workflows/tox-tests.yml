# GitHub Actions workflow for testing and continuous integration.
#
# This file performs testing using tox and tox.ini to define and configure the test environments.

name: Python Tests

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  schedule:
    # run every Monday at 6am UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names describe roles ("oldest"/"intermediate"/"current"/"latest" Python)
  # rather than versions, so they stay stable if they are made required status
  # checks. When bumping Python versions, change the tox envs below and
  # default_python, not the names. "current" is default_python; "latest"
  # (devdeps) moves to a new Python first.
  tests:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@22ddf09dfabb443adddfb9f861b7d41a787d6b1a  # v3.0.3
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV }}
    with:
      submodules: false
      coverage: ''
      default_python: '3.14'
      envs: |
        - name: Codestyle
          linux: codestyle

        - name: Linux - oldest Python, base dependencies
          linux: py312-test
          toxargs: -v

        - name: Linux - intermediate Python, base dependencies
          linux: py313-test
          toxargs: -v

        - name: Linux - oldest Python, oldest dependencies
          linux: py312-test-oldestdeps
          toxargs: -v

        - name: macOS - current Python, base dependencies
          macos: py314-test
          toxargs: -v

        - name: Windows - current Python, base dependencies
          windows: py314-test
          toxargs: -v

        - name: Linux - current Python, all dependencies, remote data, coverage
          linux: py314-test-alldeps-cov
          coverage: codecov
          toxargs: -v
          posargs: --remote-data=any

  allowed_failures:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@22ddf09dfabb443adddfb9f861b7d41a787d6b1a  # v3.0.3
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV }}
    with:
      submodules: false
      coverage: ''
      default_python: '3.14'
      envs: |
        - name: (Allowed Failure) Linux - latest Python, dev dependencies, remote data
          linux: py315-test-devdeps-cov
          coverage: codecov
          toxargs: -v
          posargs: --remote-data=any --verbose
