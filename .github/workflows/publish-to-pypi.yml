name: Release

on:
  pull_request:
  push:
    tags:
      - '*'

jobs:
  publish:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish_pure_python.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1  # v3.2.1
    # NOTE: Uncomment "if" if you do not want this to run for every PR.
    # if: ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags')) || contains(github.event.pull_request.labels.*.name, 'Build wheels'))
    with:
      save_artifacts: true
      upload_to_pypi: false
      test_extras: test
      test_command: pytest $GITHUB_WORKSPACE/specreduce/tests

  upload:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Upload built artifacts to PyPI
    runs-on: ubuntu-latest
    needs: [ publish ]
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: dist-*
          path: dist

      - name: Run upload
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
